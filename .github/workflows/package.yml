name: Package artifact

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Build publishable package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Build package entries
        run: |
          npx tsc -p tsconfig.json
          npx tsdown

      - name: Validate package and bundle budget
        run: |
          node scripts/verify-release-readiness.mjs
          npm run verify:package
          npm run verify:bundle

      - name: Create npm tarball
        run: npm pack --json > pack-result.json

      - name: Upload publishable tarball as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: dsh-chat-mindmap-${{ github.sha }}
          path: |
            *.tgz
            pack-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Attach tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            *.tgz
            pack-result.json
          fail_on_unmatched_files: true
